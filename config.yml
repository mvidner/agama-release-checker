repositories:
- url: https://github.com/agama-project/agama/
  type: git
  name: agama

- url: https://github.com/agama-project/integration-tests/
  type: git
  name: agama-integration-tests

# These are correct but not useful yet, since the code that
# shows "Git Updated" relies on the RPM versions including
# the Git hashes, and YaST packages don't do that.
#
#- url: https://github.com/yast/yast-bootloader/
#  type: git
#  name: yast2-bootloader
#
#- url: https://github.com/yast/yast-storage-ng/
#  type: git
#  name: yast2-storage-ng

- url: https://build.opensuse.org/project/show/systemsmanagement:Agama:Devel
  type: obs
  name: obs-sm-A-Devel

- url: https://download.opensuse.org/repositories/systemsmanagement:/Agama:/Devel/images/iso/
  type: mirrorcache
  name: obs-sm-A-Devel-iso # devel-tw
  files:
    - agama-installer.x86_64-*-Build*.iso

- url: https://build.opensuse.org/project/show/systemsmanagement:Agama:Release
  type: obs
  name: obs-sm-A-Release

- url: https://download.opensuse.org/repositories/systemsmanagement:/Agama:/Release/images/iso/
  type: mirrorcache
  name: obs-sm-A-Release-iso
  files:
    - agama-installer.x86_64-*-Build*.iso

- url: https://build.opensuse.org/project/show/systemsmanagement:Agama:Maintenance:SLE-16.0
  type: obs
  name: obs-sm-A-Maint160

# We don't do PRs here now
#- url: https://src.opensuse.org/pool/
#  type: gitea
#  branch: factory
#  name: obs-pool

- url: https://build.opensuse.org/project/show/openSUSE:Factory
  type: obs
  name: obs-factory
  submit_requests: true

- url: https://src.suse.de/pool/
  type: gitea
  internal: true
  branch: slfo-main
  name: ibs-pool

- url: https://src.suse.de/products/
  type: gitea
  internal: true
  branch: "16.1"
  # if none: keys of binary_packages_by_source with no filtering
  repos:
    # repo name -> match substring in PR title
    SLES: agama-installer
  name: ibs-pool-agama-installer-SLES

- url: https://download.suse.de/ibs/SUSE:/SLFO:/Products:/SLES:/16.1:/TEST/product/iso/
  internal: true
  type: mirrorcache
  name: sles-16.1-test-iso # devel-sles-test-online
  files:
    - SLES-16.1-Online-x86_64-*.iso

- url: https://src.suse.de/pool/
  type: gitea
  internal: true
  branch: slfo-1.2
  name: ibs-pool-slfo1.2

# maps from obs package to binary rpms (wildcards)
binary_patterns_by_source:
  agama-web-ui:
  - agama-web-ui
  agama:
  - agama
  - agama-common
  - agama-autoinstall
  - agama-cli
  - agama-cli-bash-completion
  rubygem-agama-yast:
  - ruby*-rubygem-agama-yast
  # agama-yast source rpm, but same OBS package
  - agama-yast
  agama-products:
  - agama-products*
  agama-integration-tests:
  - agama-integration-tests
  yast2-bootloader:
  - yast2-bootloader
  yast2-storage-ng:
  - yast2-storage-ng

# Maps obs package to a list of RPM spec files.
# If not specified, foo maps to a singleton [foo].
spec_names_by_package:
  rubygem-agama-yast:
  - rubygem-agama-yast
  - agama-yast
